[tool.poetry]
name = "jarvis-conversation-service"
version = "0.1.0"
description = "Cosmos DB Conversation & Message Persistence Service for JARVIS"
authors = ["Jarvis Team"]
readme = "README.md"
packages = [{include = "src"}]

[tool.poetry.dependencies]
python = "^3.11"
fastapi = ">=0.111.0"
uvicorn = {extras = ["standard"], version = ">=0.30.0"}
pydantic = ">=2.7.0"
pydantic-settings = ">=2.2.0"
azure-cosmos = ">=4.7.0"
python-dotenv = ">=1.0.0"
httpx = ">=0.27.0"

[build-system]
requires = ["poetry-core"]
build-backend = "poetry.core.masonry.api"
